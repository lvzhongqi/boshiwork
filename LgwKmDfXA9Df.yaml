mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: true

proxies:

  # 备用节点：IPv6 Shadowsocks
  - name: ByteVirt-SS-IPv6
    type: ss
    server: "2a12:bec0:166:111::"
    port: 18443
    cipher: chacha20-ietf-poly1305
    password: "UdjixDkY4pLkXYDSZ4SkvbDngl2W0bmp"

  # 备用节点：IPv4 Shadowsocks
  - name: ByteVirt-SS-IPv4
    type: ss
    server: 69.8.130.17
    port: 58443
    cipher: chacha20-ietf-poly1305
    password: "UdjixDkY4pLkXYDSZ4SkvbDngl2W0bmp"


proxy-groups:
  # 自动故障切换
  - name: ByteVirt-Auto
    type: fallback
    proxies:
      - ByteVirt-SS-IPv6
      - ByteVirt-SS-IPv4
    url: "https://www.gstatic.com/generate_204"
    interval: 300

  # 手动选择
  - name: Proxy
    type: select
    proxies:
      - ByteVirt-Auto
      - ByteVirt-SS-IPv6
      - ByteVirt-SS-IPv4
      - DIRECT

rules:
  - MATCH,Proxy


