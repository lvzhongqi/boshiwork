<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1330" viewBox="0 0 1500 1330">
  <defs>
    <marker id="oa" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#111111" stroke-width="1.4"/>
    </marker>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans SC","PingFang SC",sans-serif;}
      .title{font-size:28px;font-weight:700;fill:#111111;letter-spacing:.4px;}
      .sub{font-size:13px;fill:#555555;}
      .legend{font-size:12.5px;fill:#444444;}
      .pname{font-size:22px;font-weight:700;fill:#111111;letter-spacing:.4px;}
      .prole{font-size:11.5px;fill:#666666;}
      .msgname{font-size:13.5px;font-weight:700;fill:#111111;}
      .field{font-size:13px;fill:#111111;}
      .small{font-size:11.5px;fill:#555555;}
      .noteTitle{font-size:13.5px;font-weight:700;fill:#111111;}
      .noteText{font-size:12px;fill:#222222;}
      .formula{font-family:Consolas,"Courier New",monospace;font-size:12px;fill:#111111;}
      .fail{fill:#9b1c1c;font-weight:700;}
      .okTitle{font-size:15px;font-weight:700;fill:#111111;}
      .okText{font-size:12.5px;fill:#333333;}
    </style>
  </defs>

  <rect width="1500" height="1330" fill="#ffffff"/>

  <!-- Title -->
  <text x="70" y="50" class="title">FILS Public Key Authentication — UML 序列图</text>
  <text x="70" y="78" class="sub">算法 6 · 两帧认证 + 两帧关联 · 始终执行 Diffie-Hellman（PFS）· 无 TTP</text>
  <text x="70" y="98" class="sub">前提：STA 与 AP 互信公钥或证书链；有限循环群来自 dot11RSNAConfigDLCGroupTable</text>

  <text x="980" y="36" class="legend" style="font-weight:700;fill:#111111">记法</text>
  <text x="980" y="56" class="legend"><tspan style="font-family:Consolas,monospace">Sig-X(…)</tspan>：X 的私钥签名</text>
  <text x="980" y="74" class="legend"><tspan style="font-family:Consolas,monospace">AEAD(PTK-KEK)</tspan>：关联帧加密保护</text>
  <text x="980" y="92" class="legend"><tspan style="font-family:Consolas,monospace">[ … ]</tspan>：可选 / PMKSA 缓存时存在</text>

  <!-- Lifelines -->
  <line x1="330" y1="164" x2="330" y2="1225" stroke="#222222" stroke-width="1.3"/>
  <line x1="1100" y1="164" x2="1100" y2="1225" stroke="#222222" stroke-width="1.3"/>

  <!-- Participants -->
  <rect x="230" y="100" width="200" height="64" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
  <text x="330" y="128" text-anchor="middle" class="pname">STA</text>
  <text x="330" y="148" text-anchor="middle" class="prole">non-AP STA</text>

  <rect x="1000" y="100" width="200" height="64" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
  <text x="1100" y="128" text-anchor="middle" class="pname">AP</text>
  <text x="1100" y="148" text-anchor="middle" class="prole">FILS AP / Authenticator</text>

  <rect x="180" y="166" width="300" height="22" rx="5" fill="#ffffff" stroke="#dddddd" stroke-width="0.8"/>
  <text x="330" y="181" text-anchor="middle" class="small">持有：skSTA + AP 可信公钥 / 证书链</text>
  <rect x="950" y="166" width="300" height="22" rx="5" fill="#ffffff" stroke="#dddddd" stroke-width="0.8"/>
  <text x="1100" y="181" text-anchor="middle" class="small">持有：skAP + STA 可信公钥 / 证书链</text>

  <!-- STA pre-send note -->
  <rect x="50" y="198" width="470" height="105" rx="10" fill="#ffffff" stroke="#444444" stroke-width="1.2" stroke-dasharray="7 5"/>
  <text x="68" y="223" class="noteTitle">① STA 发送前计算</text>
  <text x="68" y="245" class="noteText">选群 G；生成 (skSTA, gSTA)、SNonce、FILS Session</text>
  <text x="68" y="265" class="noteText">若尝试 PMKSA 缓存：RSNE 带 PMKID List</text>
  <text x="68" y="285" class="noteText">gSTA 按 12.4.7.2.4 编码进 FFE</text>

  <!-- Msg1 -->
  <text x="715" y="310" text-anchor="middle" class="field">Auth (Seq=1)　ANA=6, G, FFE=gSTA, SNonce, Session, RSNE</text>
  <text x="715" y="328" text-anchor="middle" class="small">（RSNE：1 个 Pairwise Cipher + 1 个 AKM；可选 PMKID List）</text>
  <line x1="330" y1="350" x2="1100" y2="350" stroke="#111111" stroke-width="1.8" marker-end="url(#oa)"/>
  <text x="715" y="372" text-anchor="middle" class="msgname">Msg1 · 密钥建立①</text>

  <!-- AP post note -->
  <rect x="1130" y="390" width="340" height="115" rx="10" fill="#ffffff" stroke="#444444" stroke-width="1.2" stroke-dasharray="7 5"/>
  <text x="1148" y="415" class="noteTitle">② AP 接收后处理</text>
  <text x="1148" y="437" class="noteText">G 不支持 → <tspan class="fail">Status 77</tspan></text>
  <text x="1148" y="457" class="noteText">NIST SP 800-56A 5.6.2.3.2 校验 gSTA</text>
  <text x="1148" y="477" class="noteText">生成 ANonce、(skAP, gAP)</text>
  <text x="1148" y="497" class="noteText">DHss = scalar-op(skAP, gSTA)</text>

  <!-- Msg2 -->
  <text x="715" y="520" text-anchor="middle" class="field">Auth (Seq=2)　ANA=6, Status=0, G, FFE=gAP, ANonce, Session, RSNE</text>
  <text x="715" y="538" text-anchor="middle" class="small">（缓存时含选中的 PMKID）</text>
  <line x1="1100" y1="560" x2="330" y2="560" stroke="#111111" stroke-width="1.8" marker-end="url(#oa)"/>
  <text x="715" y="582" text-anchor="middle" class="msgname">Msg2 · 密钥建立②</text>

  <!-- STA post note -->
  <rect x="50" y="595" width="470" height="115" rx="10" fill="#ffffff" stroke="#444444" stroke-width="1.2" stroke-dasharray="7 5"/>
  <text x="68" y="620" class="noteTitle">③ STA 接收后处理</text>
  <text x="68" y="642" class="noteText">校验 G / Session；按 NIST 校验 gAP</text>
  <text x="68" y="662" class="noteText">DHss = scalar-op(skSTA, gAP)</text>
  <text x="68" y="682" class="noteText">推导 PMK / PMKID / PTK；删除 DHss</text>

  <!-- Derivation -->
  <rect x="360" y="725" width="880" height="95" rx="10" fill="#f7f7f7" stroke="#333333" stroke-width="1.2" stroke-dasharray="7 5"/>
  <text x="380" y="750" class="noteTitle">④ 双方独立执行密钥推导</text>
  <text x="380" y="772" class="formula">PMK = HMAC-Hash(SNonce ‖ ANonce, DHss)</text>
  <text x="380" y="792" class="formula">PMKID = Truncate-128(Hash(gSTA ‖ gAP))</text>
  <text x="380" y="812" class="formula">PTK = PRF-X(PMK, "FILS PTK Derivation", SPA ‖ AA ‖ SNonce ‖ ANonce) → ICK / PTK-KEK / TK</text>

  <!-- Msg3 -->
  <text x="715" y="850" text-anchor="middle" class="field">(Re)Assoc Request　KeyAuth = Sig-STA(gSTA‖gAP‖SNonce‖ANonce‖STA-MAC‖AP-BSSID)</text>
  <text x="715" y="868" text-anchor="middle" class="small">AAD = Capability…FILS Session；AEAD(PTK-KEK)；FILS Public Key = STA 证书 / 公钥</text>
  <line x1="330" y1="890" x2="1100" y2="890" stroke="#111111" stroke-width="1.8" marker-end="url(#oa)"/>
  <text x="715" y="912" text-anchor="middle" class="msgname">Msg3 · 密钥确认①</text>

  <!-- AP post note -->
  <rect x="1130" y="930" width="340" height="115" rx="10" fill="#ffffff" stroke="#444444" stroke-width="1.2" stroke-dasharray="7 5"/>
  <text x="1148" y="955" class="noteTitle">⑤ AP 接收后处理</text>
  <text x="1148" y="977" class="noteText">校验 Session / AEAD / RSNE</text>
  <text x="1148" y="997" class="noteText">RFC 5280 验证书链并验签</text>
  <text x="1148" y="1017" class="noteText">失败 → <tspan class="fail">Status 112</tspan></text>
  <text x="1148" y="1037" class="noteText">成功 → 安装 PTKSA</text>

  <!-- Msg4 -->
  <text x="715" y="1055" text-anchor="middle" class="field">(Re)Assoc Response　KeyAuth = Sig-AP(gAP‖gSTA‖ANonce‖SNonce‖AP-BSSID‖STA-MAC)</text>
  <text x="715" y="1073" text-anchor="middle" class="small">Key Delivery = GTK / IGTK / BIGTK / WIGTK；AEAD(PTK-KEK)</text>
  <line x1="1100" y1="1095" x2="330" y2="1095" stroke="#111111" stroke-width="1.8" marker-end="url(#oa)"/>
  <text x="715" y="1117" text-anchor="middle" class="msgname">Msg4 · 密钥确认②</text>

  <!-- STA post note -->
  <rect x="50" y="1130" width="470" height="95" rx="10" fill="#ffffff" stroke="#444444" stroke-width="1.2" stroke-dasharray="7 5"/>
  <text x="68" y="1155" class="noteTitle">⑥ STA 接收后处理</text>
  <text x="68" y="1177" class="noteText">校验 Session / AEAD / RSNE / AP 签名</text>
  <text x="68" y="1197" class="noteText">安装 TK、GTK（及 IGTK/BIGTK/WIGTK）</text>
  <text x="68" y="1217" class="noteText">PTKSA 建立完成 → 进入数据保护</text>

  <!-- Result -->
  <rect x="50" y="1245" width="1420" height="62" rx="8" fill="#f4f4f4" stroke="#333333" stroke-width="1.5"/>
  <text x="70" y="1271" class="okTitle">FILS Public Key 认证完成：4 帧完成认证 + 关联 + 密钥确认；无 TTP、无 4 次 EAPOL 握手</text>
  <text x="70" y="1292" class="okText">PMKSA 缓存变体：KeyAuth 改为 HMAC-ICK(…‖gSTA‖gAP)；证书 / 公钥仍放在关联帧的 FILS Public Key 元素中</text>

</svg>
