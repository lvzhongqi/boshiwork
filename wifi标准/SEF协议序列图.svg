<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1280" viewBox="0 0 1600 1280">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans SC","PingFang SC",sans-serif;}
      .title{font-size:30px;font-weight:700;fill:#172033;letter-spacing:.5px;}
      .sub{font-size:13px;fill:#5d677a;}
      .legend{font-size:12.5px;fill:#4b5563;}
      .pname{font-size:24px;font-weight:700;fill:#ffffff;letter-spacing:.5px;}
      .prole{font-size:12px;fill:#ffffff;opacity:.86;}
      .msg{font-size:14px;font-weight:700;fill:#1f2937;}
      .msg2{font-size:12px;fill:#64748b;}
      .noteTitle{font-size:13.5px;font-weight:700;fill:#7a3f00;}
      .noteText{font-size:12.5px;fill:#5b4a2f;}
      .asTitle{font-size:13.5px;font-weight:700;fill:#1e3a8a;}
      .asText{font-size:12.5px;fill:#334155;}
      .okTitle{font-size:16px;font-weight:700;fill:#0b6b63;}
      .okText{font-size:13px;fill:#285e58;}
      .plain{font-size:12.5px;fill:#64748b;}
    </style>
  </defs>

  <rect width="1600" height="1280" fill="#ffffff"/>

  <!-- Header -->
  <text x="70" y="50" class="title">SEF（Secure and Efficient FILS）认证协议序列图</text>
  <text x="70" y="78" class="sub">依据：L. Zhang &amp; M. Ma, “Secure and Efficient Fast Initial Link Setup Scheme Design”, IEEE WCNC 2019, Figure 1（SEF Mechanism）</text>

  <text x="1100" y="42" class="legend" style="font-weight:700;fill:#172033">记法</text>
  <text x="1100" y="62" class="legend"><tspan style="font-weight:700">{…}rIK</tspan>：rIK 计算的 MIC（仅完整性，不加密）</text>
  <text x="1100" y="80" class="legend"><tspan style="font-weight:700">{…}PTK</tspan>：PTK / KEK 的 AEAD 加密</text>
  <text x="1100" y="98" class="legend"><tspan style="font-weight:700">Seq</tspan>：单调递增序列号，用于防重放</text>

  <text x="1050" y="185" text-anchor="middle" class="plain">AP ↔ AS：安全信道（ERP / AAA，本文假设安全）</text>

  <!-- Lifelines -->
  <line x1="300" y1="162" x2="300" y2="1175" stroke="#b8c2d4" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="800" y1="162" x2="800" y2="1175" stroke="#b8c2d4" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="1300" y1="162" x2="1300" y2="1175" stroke="#b8c2d4" stroke-width="2" stroke-dasharray="7 7"/>

  <!-- Activation bars -->
  <rect x="292" y="270" width="16" height="98" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="292" y="842" width="16" height="243" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>

  <rect x="792" y="305" width="16" height="175" rx="8" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1.5"/>
  <rect x="792" y="690" width="16" height="188" rx="8" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1.5"/>
  <rect x="792" y="1042" width="16" height="133" rx="8" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1.5"/>

  <rect x="1292" y="448" width="16" height="274" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>

  <!-- Participant boxes -->
  <g>
    <rect x="210" y="100" width="180" height="62" rx="10" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="300" y="127" text-anchor="middle" class="pname">STA</text>
    <text x="300" y="147" text-anchor="middle" class="prole">non-AP STA</text>
  </g>
  <g>
    <rect x="710" y="100" width="180" height="62" rx="10" fill="#0f766e" stroke="#0b5f59" stroke-width="1.5"/>
    <text x="800" y="127" text-anchor="middle" class="pname">AP</text>
    <text x="800" y="147" text-anchor="middle" class="prole">FILS AP / Authenticator</text>
  </g>
  <g>
    <rect x="1210" y="100" width="180" height="62" rx="10" fill="#b45309" stroke="#92400e" stroke-width="1.5"/>
    <text x="1300" y="127" text-anchor="middle" class="pname">AS</text>
    <text x="1300" y="147" text-anchor="middle" class="prole">Authentication Server</text>
  </g>

  <!-- Initial STA note -->
  <rect x="60" y="205" width="445" height="62" rx="8" fill="#fff8e9" stroke="#e3a23c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="80" y="228" class="noteTitle">① STA 由 rRK 派生 rIK</text>
  <text x="80" y="250" class="noteText">rRK 来自此前完整 802.1X/EAP（ERP）；rIK 用于 Msg1 / Msg1' 的 MIC</text>

  <!-- Msg1 -->
  <text x="550" y="320" text-anchor="middle" class="msg">Msg1　{SNonce, KeyName-NAI, Seq, Cryptosuite}rIK</text>
  <text x="550" y="339" text-anchor="middle" class="msg2">rIK-MIC 保护（不加密），用于向 AP / AS 发起重认证</text>
  <line x1="300" y1="355" x2="800" y2="355" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- AP processing after Msg1 -->
  <line x1="800" y1="399" x2="830" y2="399" stroke="#b8c2d4" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="830" y="366" width="380" height="66" rx="8" fill="#eafaf1" stroke="#1f9d63" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="848" y="388" class="noteTitle">② AP 校验 Seq 单调递增</text>
  <text x="848" y="408" class="noteText">AP 不持有 rIK，无法验证 MIC；仅能检查序列号</text>
  <text x="848" y="427" class="noteText">随后追加 ANonce，转发 Msg1' 给 AS</text>

  <!-- Msg1' -->
  <text x="1050" y="448" text-anchor="middle" class="msg">Msg1'　ANonce, {SNonce, KeyName-NAI,</text>
  <text x="1050" y="466" text-anchor="middle" class="msg">Seq, Cryptosuite}rIK</text>
  <line x1="800" y1="482" x2="1300" y2="482" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- AS processing -->
  <rect x="1035" y="502" width="520" height="65" rx="8" fill="#eef4ff" stroke="#4f7cff" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1053" y="525" class="asTitle">③ 由 KeyName-NAI 定位 rRK → 派生 rIK</text>
  <text x="1053" y="545" class="asText">验证 Msg1' 的 MIC 与 Seq；失败则终止</text>

  <rect x="1035" y="578" width="520" height="78" rx="8" fill="#eef4ff" stroke="#4f7cff" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1053" y="601" class="asTitle">④ 验证成功：以 SNonce / ANonce 派生</text>
  <text x="1053" y="621" class="asText">rMSK、PMK、PTK；计算 Auth-field（Key-auth）</text>
  <text x="1053" y="641" class="asText">并将 PMK / PTK / rMSK / rIK 一并交给 AP</text>

  <!-- Msg2' -->
  <text x="1050" y="686" text-anchor="middle" class="msg">Msg2'　PMK, PTK, rMSK, rIK, Auth-field,</text>
  <text x="1050" y="704" text-anchor="middle" class="msg">{KeyName-NAI, Seq, Cryptosuite}rIK</text>
  <line x1="1300" y1="720" x2="800" y2="720" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- AP processing after Msg2' -->
  <line x1="800" y1="750" x2="830" y2="750" stroke="#b8c2d4" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="830" y="732" width="390" height="68" rx="8" fill="#eafaf1" stroke="#1f9d63" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="848" y="755" class="noteTitle">⑤ 保存 PMK / PTK / rMSK / rIK / Auth-field</text>
  <text x="848" y="775" class="noteText">构造并发送 Msg2；AP 不重复执行密钥派生</text>
  <text x="848" y="793" class="noteText">（计算前移到 AS，降低 AP 负担）</text>

  <!-- Msg2 -->
  <text x="550" y="844" text-anchor="middle" class="msg">Msg2　{ANonce, {GTK, Auth-field}PTK,</text>
  <text x="550" y="862" text-anchor="middle" class="msg">KeyName-NAI, Seq, Cryptosuite}rIK</text>
  <line x1="800" y1="878" x2="300" y2="878" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- STA processing -->
  <rect x="60" y="896" width="450" height="66" rx="8" fill="#fff8e9" stroke="#e3a23c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="78" y="919" class="noteTitle">⑥ 用 rMSK、SNonce、ANonce 派生 PMK / PTK</text>
  <text x="78" y="939" class="noteText">用 PTK 解密内层 {GTK, Auth-field}PTK，取得 GTK 与 Auth-field</text>

  <rect x="60" y="970" width="450" height="58" rx="8" fill="#fff8e9" stroke="#e3a23c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="78" y="993" class="noteTitle">⑦ 验证 Auth-field</text>
  <text x="78" y="1013" class="noteText">验证成功 → 发送 ACK（Msg3）；失败 → 放弃本次认证</text>

  <!-- Msg3 -->
  <text x="550" y="1040" text-anchor="middle" class="msg">Msg3　{Auth-field, Nonce, Seq}PTK</text>
  <text x="550" y="1058" text-anchor="middle" class="msg2">STA 的 ACK / 密钥确认，PTK 的 AEAD 保护</text>
  <line x1="300" y1="1072" x2="800" y2="1072" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- AP final processing -->
  <line x1="800" y1="1100" x2="830" y2="1100" stroke="#b8c2d4" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="830" y="1086" width="445" height="86" rx="8" fill="#eafaf1" stroke="#1f9d63" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="848" y="1109" class="noteTitle">⑧ 用 PTK 验证 Auth-field 与 Seq</text>
  <text x="848" y="1129" class="noteText">成功 → 认证完成；失败 → 回到初始状态等待新 Msg1</text>
  <text x="848" y="1149" class="noteText">已接受有效 Msg3 后不再回退或重装密钥 → 抗 KRA</text>

  <!-- Success -->
  <rect x="60" y="1188" width="1480" height="70" rx="10" fill="#eafaf1" stroke="#1f9d63" stroke-width="2"/>
  <text x="80" y="1215" class="okTitle">SEF 认证完成：PMK / PTK 已确认，GTK 已分发，可进入数据保护</text>
  <text x="80" y="1240" class="okText">抗 KRA 要点：Msg3 仅作为一次 ACK；AP 收到有效 Msg3 后拒绝回退与重装；Msg3 无效则回到初始等待新 Msg1</text>

</svg>
