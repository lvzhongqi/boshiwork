# 有版权的原始文档：under 命中的目录底下，除 keep 列出的文件名外一律不拷。
#
# ISO/IEC 标准是 BSI 付费文档，语料里这几份还是「Committee member copy: Do not
# reproduce」的委员会副本——文档自己写着禁止再分发。那行水印本身也是身份线索：
# 能拿到委员会副本的组屈指可数，评审期它比姓名更能定位作者。`source/main/*.md`
# 是全文逐条转写，跟 PDF 同一性质，所以按格式列清单没有意义。
#
# 因此这里是**默认扣下、白名单放行**：pdf / md / doc / docx 固然挡住，日后语料里
# 冒出 .rtf、.html、从文档里抽出来的 images/，不改规则也已经挡住了。README 留着，
# 版权说明写在那里。
#
# 扣下的只是输入文档。annotations / principals / claims / results / formal 照发，
# 那些是自己的产物——ProVerif 模型加假设加 verdict 才是「分析做过」的证据。
# ISO 的理由最硬，所以规则从它长出来，但现在对每个单元一视同仁：`*/source`
# 底下只放行文档正文本身（`*.md`）和 README。多条 withhold 是**最严的赢**——
# 下面 ISO 那条 keep 只有 README.md，不会被这条放宽。
#
# keep 列的就是 loader 的 `_SUPPORTED_EXTS`（modules/document/loader.py:52）里的
# 文本格式。**不能只留 *.md**：TLS13 draft18/draft20、OAuth-2.0 draft22、
# EDHOC draft-08/draft-12 这五个族的主文档是 `.txt`（draft-tls13-20.txt 之类），
# 只留 md 会让 `_find_main_doc` 抛 RuntimeError，五个族当场不可用。
#
# refs 同样一份不少。判据不是「缺了还跑不跑得动」——`_find_ref_docs` 目录不存在
# 时返回空列表，不报错——而是「重跑出来的东西和 runs/ 里记录的是不是同一回事」。
# 被引文档是产生那批 run 的输入的一部分，少一份，重跑读到的文档集就变了，
# 那不叫复现。
#
# 挡住的是非文本：图片、pdf（common.toml 全局挡）、3GPP 的 `33501-f00.doc`
# （3.62 MB，同目录有转写好的 33501-f00.md，loader 取的就是后者）。
[[lib.withhold]]
under = "*/source"
keep = ["README.md", "*.md", "*.txt"]

# 受限出版方三家，同一条规矩：正文一律不放行，只留 README。三条分开写而不是
# 合成一条，是因为理由不同、将来撤销的条件也不同——哪天拿到某一家的书面许可，
# 删掉的是那一条，不是三家一起松。判据查的是文档自己，不是转述：
#
# - ISO/IEC：BSI 付费文档，语料里那几份还是「Committee member copy: Do not
#   reproduce」的委员会副本。水印本身还是身份线索——能拿到委员会副本的组屈指可数。
# - 3GPP：`33501-f00.doc` 版权页原文「No part may be reproduced except as
#   authorized by written permission. The copyright and the foregoing restriction
#   extend to reproduction in all media.」规范可以自由下载，但自由下载不等于可以
#   再分发，这句禁的正是 reproduction。**而且转写稿把这段声明整个丢了**
#   （textutil 从 Foreword 起截），发出去就是剥掉版权声明的正文，比带着声明发更糟。
# - FIDO Alliance：`fido-uaf-protocol.md:35` 只有「Copyright © 2013-2020 FIDO
#   Alliance All Rights Reserved.」，主文档加 5 份 refs 全文没有任何再分发或制作
#   衍生作品的授权；语料里那份 Markdown 是从官方 HTML 转来的，本身就是衍生作品。
#
# 这三家正是 `latest_3_to_remove_sensitive_open.py::RESTRICTED` 的三家。**两条发布
# 路径此前对同一份文档给了相反的答案**：runs 树里 3GPP / FIDO 的句子被逐句换成占位，
# 语料这边却整份发出去，因为上面那条 `*/source` 的 `keep = ["*.md"]` 顺手放行了它们
# ——那条本来只是为了让 TLS13 / OAuth / EDHOC 五个族的 `.txt` 主文档能发（不发它们
# `_find_main_doc` 直接抛错）。多条 withhold 是最严的赢，所以下面三条不会被它放宽。
#
# 只扣输入文档。annotations / claims / flow / formal / results 照发——那些是自己的
# 产物，ProVerif 模型加假设加 verdict 才是「分析做过」的证据。代价是这三家的单元在
# 工件里不能端到端重跑（`_find_main_doc` 找不到 `source/main/`），这一条已知并接受，
# 处理在 TODO.md「104 个选中协议，工件里只有 15 个跑得起来」。
#
# keep 只留 README.md 而不是写一条「挡 *.md」：本文件通篇是默认扣下、白名单放行，
# 反过来写成黑名单，日后语料里冒出 .rtf / .html / 抽出来的 images/ 就又漏了。
# 今天这三家 source/ 底下除 README 外正好只有 .md（.doc / .pdf / 图片已被上面那条和
# 全局 exclude 挡掉），所以效果就是「只扣 md」。
[[lib.withhold]]
under = "ISO/*/source"
keep = ["README.md"]

[[lib.withhold]]
under = "3gpp/*/source"
keep = ["README.md"]

[[lib.withhold]]
under = "informal/FIDO/*/source"
keep = ["README.md"]

# 正文替换：命中的文件正文换成扣留说明，YAML frontmatter 留着。和 withhold 的
# 分工是「这份东西还有没有别的用处」——文档正文没有，整份不拷；下面这些有，
# 删了会让重跑和阅读都少一句话，所以留壳换瓤。
#
# `subprotocol.md` 是语料自己写的「这个子协议建模哪一支」，
# `loader.py::_read_subprotocol_md` 读它的正文注进每个抽取节点的提示词。它躲开了
# 上面全部三条 withhold，因为那三条都锚在 `*/source` 上，而它在
# `subprotocols/<机制>/` 底下——ISO 正文就是这么整段走出去的。
#
# 26 份 ISO subprotocol.md 里 24 份是 91 字节的一句话，只有 9798-2 的
# `mechanism-2-no-identifier` 和 `mechanism-4-no-identifier` 各 1.8 KB：为了讲清
# 「可选的 I_B 省略这一支」，它们把 §6.1.2 / §6.2.2 整段作为 Markdown 引用块抄了
# 进来，还夹着几处行内引语。规则写成 `*-no-identifier` 而不是点名两个目录，是因为
# 判据是「这一支需要引条款才能说清」，将来再出一个同类的会自动落进来；真要多出一个
# 不引条款的 `-no-identifier`，代价只是它也拿到一份说明，不是漏发。
[[lib.replace]]
under = "ISO/*/subprotocols/*-no-identifier"
match = "subprotocol.md"
why = """ISO/IEC 9798 and 11770 are sold, and their terms forbid redistributing
the documents or a normalised copy of them; a block quotation of a clause is a
copy of that clause."""

# results/ 只发两份判定文件。cases_results.json 看着最该删（1.19 MB，语料里
# 最大的一类 JSON），但 nodes/cross_check/node.py 直接读它当 ground truth，
# 而 cross_check 是管线的最后一个节点——删了每次重跑都在最后一步崩。
[[lib.withhold]]
under = "*/results"
keep = ["results.json", "cases_results.json"]

# 目标仓库的提交身份。不设置的话 git 会取全局身份，提交里就会出现真实姓名和
# 邮箱——文件内容擦得再干净，git log 一行就漏了。
[git]
name = "Anonymous"
email = "anonymous@example.com"
